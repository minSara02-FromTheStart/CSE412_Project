<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Logging out - NutriNest</title>

<style>

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    background:#f7faf7;
}


.logout-box{

    text-align:center;
    padding:40px;
    border-radius:20px;
    background:white;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);

}


.logout-box h2{
    color:#006b3c;
}


.spinner{

width:40px;
height:40px;
border:5px solid #ddd;
border-top:5px solid #006b3c;
border-radius:50%;
margin:20px auto;
animation:spin 1s linear infinite;

}


@keyframes spin{

100%{
transform:rotate(360deg);
}

}


</style>

</head>


<body>


  <script type="module">
    import { auth } from "./js/firebase-config.js";
    import { signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";  
    // Automatically logs out and sends to login page
    signOut(auth).then(() => {
      window.location.href = 'login.html';
    });
  </script>

</body>

</html>
