<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Logging out - NutriNest</title>

<style>

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    background:#f7faf7;
}


.logout-box{

    text-align:center;
    padding:40px;
    border-radius:20px;
    background:white;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);

}


.logout-box h2{
    color:#006b3c;
}


.spinner{

width:40px;
height:40px;
border:5px solid #ddd;
border-top:5px solid #006b3c;
border-radius:50%;
margin:20px auto;
animation:spin 1s linear infinite;

}


@keyframes spin{

100%{
transform:rotate(360deg);
}

}


</style>

</head>


<body>


<div class="logout-box">

<h2>🌿 NutriNest</h2>

<div class="spinner"></div>

<p>Logging you out...</p>


</div>



<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { 
getAuth,
signOut 
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



const firebaseConfig = {

apiKey: "AIzaSyAJOWu8ZYEyUms8nF1uVBw2m9v4ApNaT4s",

authDomain: "nutrinest-408d4.firebaseapp.com",

projectId: "nutrinest-408d4",

storageBucket: "nutrinest-408d4.firebasestorage.app",

messagingSenderId: "44196278510",

appId: "1:44196278510:web:11acb64840e2d536c843ff"

};



const app = initializeApp(firebaseConfig);

const auth = getAuth(app);



signOut(auth)
.then(()=>{

    setTimeout(()=>{

        window.location.href="login.html";

    },1000);


})
.catch((error)=>{

console.log(error);

});


</script>


</body>

</html>
